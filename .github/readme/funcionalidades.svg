<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="608" viewBox="0 0 1200 608" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Funcionalidades de brilho-flow</title>
<desc id="desc">Agenda e atendimentos: Conflito de horário, máquina de estados e Quadro do dia com sete etapas, avançando por botão ou arrastando. · Clientes e veículos: Cadastro com classificação de relacionamento e a placa Mercosul como identificador do veículo. · Estoque: Custo por embalagem, níveis de estoque e baixa validada no consumo de produtos do atendimento. · Financeiro: Receitas, despesas e parcelamento em até 12x sem perder centavos (dinheiro em BigInt). · Planos de assinatura: Matriz plano × recurso: o plano Básico esconde estoque e financeiro; o Pro libera tudo. · Relatórios: Períodos e indicadores, com exportação em PDF e planilha. · Console da plataforma: Administração de empresas, assinaturas e trilha de auditoria. · Multiempresa: Cada empresa só enxerga os próprios dados: o empresaId vem sempre da sessão assinada.</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" opacity=".06"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern>
<clipPath id="card"><rect width="1200" height="608" rx="10"/></clipPath>
</defs>
