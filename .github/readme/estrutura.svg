<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="488" viewBox="0 0 1200 488" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Estrutura de brilho-flow</title>
<desc id="desc">src/: código da aplicação · app/: rotas (App Router) e API REST · domain/: regras de negócio, funções puras · server/: orquestração: transação e domínio · db/: schema Drizzle, migrate e seed · auth/: sessão, senha e guards · components/: design system e telas · drizzle/: migrations SQL versionadas · tests/: testes do domínio (Vitest) · docs/: plano de deploy na Cloudflare · REQUISITOS.md: casos de uso e regras de negócio · wrangler.jsonc: configuração do Worker</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" opacity=".06"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern>
<clipPath id="card"><rect width="1200" height="488" rx="10"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="488" fill="#191817"/>
<rect width="1200" height="488" fill="url(#grid)"/>
<rect width="1200" height="40" fill="#262422"/>
<rect y="40" width="1200" height="1" fill="#3a3733"/>
<rect x="20" y="14" width="12" height="12" fill="#e5534b"/>
<rect x="40" y="14" width="12" height="12" fill="#e0a43b"/>
<rect x="60" y="14" width="12" height="12" fill="#5fb85f"/>
<text x="600" y="25" text-anchor="middle" class="mono" font-size="14" fill="#86817a">estrutura</text>
<text x="48" y="88" class="mono" font-size="15" fill="#d97757">$</text>
<text x="66" y="88" class="mono" font-size="15" fill="#ece9e4">tree brilho-flow</text>
<text x="48" y="128" class="mono" font-size="15" font-weight="700" fill="#d97757">brilho-flow/</text>
<text x="48" y="154" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">├── <tspan fill="#d97757" font-weight="700">src/</tspan></text>
<text x="246" y="154" class="mono" font-size="14" fill="#86817a"># código da aplicação</text>
<text x="48" y="180" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">│   ├── <tspan fill="#d97757" font-weight="700">app/</tspan></text>
<text x="246" y="180" class="mono" font-size="14" fill="#86817a"># rotas (App Router) e API REST</text>
<text x="48" y="206" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">│   ├── <tspan fill="#d97757" font-weight="700">domain/</tspan></text>
<text x="246" y="206" class="mono" font-size="14" fill="#86817a"># regras de negócio, funções puras</text>
<text x="48" y="232" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">│   ├── <tspan fill="#d97757" font-weight="700">server/</tspan></text>
<text x="246" y="232" class="mono" font-size="14" fill="#86817a"># orquestração: transação e domínio</text>
<text x="48" y="258" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">│   ├── <tspan fill="#d97757" font-weight="700">db/</tspan></text>
<text x="246" y="258" class="mono" font-size="14" fill="#86817a"># schema Drizzle, migrate e seed</text>
<text x="48" y="284" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">│   ├── <tspan fill="#d97757" font-weight="700">auth/</tspan></text>
<text x="246" y="284" class="mono" font-size="14" fill="#86817a"># sessão, senha e guards</text>
<text x="48" y="310" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">│   └── <tspan fill="#d97757" font-weight="700">components/</tspan></text>
<text x="246" y="310" class="mono" font-size="14" fill="#86817a"># design system e telas</text>
<text x="48" y="336" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">├── <tspan fill="#d97757" font-weight="700">drizzle/</tspan></text>
<text x="246" y="336" class="mono" font-size="14" fill="#86817a"># migrations SQL versionadas</text>
<text x="48" y="362" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">├── <tspan fill="#d97757" font-weight="700">tests/</tspan></text>
<text x="246" y="362" class="mono" font-size="14" fill="#86817a"># testes do domínio (Vitest)</text>
<text x="48" y="388" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">├── <tspan fill="#d97757" font-weight="700">docs/</tspan></text>
<text x="246" y="388" class="mono" font-size="14" fill="#86817a"># plano de deploy na Cloudflare</text>
<text x="48" y="414" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">├── <tspan fill="#ece9e4">REQUISITOS.md</tspan></text>
<text x="246" y="414" class="mono" font-size="14" fill="#86817a"># casos de uso e regras de negócio</text>
<text x="48" y="440" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">└── <tspan fill="#ece9e4">wrangler.jsonc</tspan></text>
<text x="246" y="440" class="mono" font-size="14" fill="#86817a"># configuração do Worker</text>
<rect width="1200" height="488" fill="url(#scan)"/>
</g>
<rect x=".5" y=".5" width="1199" height="487" rx="9.5" fill="none" stroke="#3a3733"/>
</svg>
